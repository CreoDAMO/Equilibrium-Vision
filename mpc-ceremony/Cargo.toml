[package]
name = "mpc-ceremony"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mpc-ceremony"
path = "src/main.rs"

[dependencies]
equilibrium = { path = "../equilibrium", package = "equilibrium-core" }
ark-bn254 = "0.4"
ark-groth16 = "0.4"
ark-serialize = "0.4"
ark-snark = "0.4"
ark-std = "0.4"
ark-relations = "0.4"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.10"

# ── Security: minimum version pins for transitive deps (Dependabot) ──────────
yamux = { version = ">=0.12.1", optional = true }
hickory-proto = { version = ">=0.24.2", optional = true }
tracing-subscriber = { version = ">=0.3.19", optional = true }

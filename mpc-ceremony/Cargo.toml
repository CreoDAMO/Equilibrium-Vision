[package]
name = "mpc-ceremony"
version = "0.1.0"
edition = "2021"

[lib]
name = "mpc_ceremony"
path = "src/lib.rs"

[[bin]]
name = "mpc-ceremony"
path = "src/main.rs"

[[bin]]
name = "export-r1cs"
path = "src/bin/export_r1cs.rs"

[[bin]]
name = "dump-witness"
path = "src/bin/dump_witness.rs"

[[bin]]
name = "smoke-prove-verify"
path = "src/bin/smoke_prove_verify.rs"

[dependencies]
equilibrium = { path = "../equilibrium", package = "equilibrium-core" }
ark-bn254 = "0.4"
ark-groth16 = "0.4"
ark-serialize = "0.4"
ark-snark = "0.4"
ark-std = "0.4"
ark-relations = "0.4"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-traits = "0.2"
ark-ff = "0.4"
ark-ec = "0.4"
ark-poly = "0.4"

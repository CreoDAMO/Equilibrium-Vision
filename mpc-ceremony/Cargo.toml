[package]
name = "mpc-ceremony"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mpc-ceremony"
path = "src/main.rs"

[dependencies]
equilibrium = { path = "../equilibrium", package = "equilibrium-core" }
ark-bn254 = "0.4"
ark-groth16 = "0.4"
ark-serialize = "0.4"
ark-std = "0.4"
ark-relations = "0.4"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[package]
name = "equilibrium-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.79"

[[bin]]
name = "testnet-node"
path = "testnet/node/main.rs"

[[bin]]
name = "wallet"
path = "src/bin/wallet.rs"

[[bin]]
name = "p2p-sidecar"
path = "src/bin/p2p-sidecar.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2 = "0.10"
rand = "0.8.5"         # pinned: ark-groth16 0.4 requires rand_core 0.6
rand_core = "0.6.4"   # explicit pin; risc0-zkvm 2.3 uses rand_core 0.9 internally (no boundary crossing)
pbkdf2 = { version = "0.12", features = ["hmac"] }
aes-gcm = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
libp2p = { version = "0.56", features = ["full"] }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
ark-std = "0.4"
ark-snark = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-serialize = "0.4"
ark-relations = "0.4"
ark-r1cs-std = "0.4"
ark-groth16 = "0.4"
ark-bn254 = "0.4"
log = "0.4"

# ── RISC Zero optional deps (enable with --features risc0) ───────────────────
risc0-zkvm = { version = "2.3", optional = true }
methods     = { path = "../methods", optional = true }

# ── Security: minimum version pins for transitive deps (Dependabot) ──────────
# yamux: remote panic via malformed Data frame (GHSA-2qph-qpvm-2qf7, High)
yamux = { version = ">=0.12.1", optional = true }
# hickory-proto: NSEC3 unbounded loop + O(n²) compression (High + Moderate)
hickory-proto = { version = ">=0.24.2", optional = true }
# tracing-subscriber: ANSI escape sequence poisoning (Low)
tracing-subscriber = { version = ">=0.3.19", optional = true }

[features]
risc0 = ["dep:risc0-zkvm", "dep:methods"]

# ── Android JNI bridge ────────────────────────────────────────────────────────
# The `jni` crate is only pulled in when cross-compiling for Android via
# cargo-ndk.  Host builds (consensus-api, testnet-node) remain unaffected.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[package]
name = "equilibrium-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.79"

[[bin]]
name = "testnet-node"
path = "testnet/node/main.rs"

[[bin]]
name = "consensus-api"
path = "src/bin/consensus-api.rs"

[[bin]]
name = "wallet"
path = "src/bin/wallet.rs"

[[bin]]
name = "p2p-sidecar"
path = "src/bin/p2p-sidecar.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2 = "0.10"
rand = "0.8.5"
rand_core = "0.6.4"
pbkdf2 = { version = "0.12", features = ["hmac"] }
aes-gcm = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
libp2p = { version = "0.56", features = ["full"] }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
ark-std = "0.4"
ark-snark = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-serialize = "0.4"
ark-relations = "0.4"
ark-r1cs-std = "0.4"
ark-groth16 = "0.4"
ark-poly = "0.4"
ark-bn254 = "0.4"
log = "0.4"

# ── RISC Zero optional deps (enable with --features risc0) ───────────────────
# CVE-2025-61588 / GHSA-jqq4-c7wq-36h7: need >= 3.0.3 (or >= 2.3.2).
# Keep in lockstep with methods/guest and methods/zkml-guest.
risc0-zkvm = { version = "3.0.3", optional = true }
methods = { path = "../methods", optional = true }
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }

# ── Security: minimum version pins for transitive deps (Dependabot) ──────────
yamux = { version = ">=0.12.1", optional = true }
hickory-proto = { version = ">=0.24.2", optional = true }
tracing-subscriber = { version = ">=0.3.19", optional = true }

[features]
risc0 = ["dep:risc0-zkvm", "dep:methods", "dep:reqwest"]

# ── Android JNI bridge ────────────────────────────────────────────────────────
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

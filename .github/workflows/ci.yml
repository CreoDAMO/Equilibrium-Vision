# ─────────────────────────────────────────────────────────────────────────────
# docs/ci-fixed.yml
#
# Copy this file over .github/workflows/ci.yml in your GitHub repo.
#
# What changed vs the current workflow (commit 850074c0):
#
#   REMOVED — "Build consensus-api binary" step:
#     (Historical note — current main still builds consensus-api when present.)
#
#   KEPT — ALLOW_TS_TRAPDOOR_PROVER=true in Vitest env (from 850074c0):
#     This is correct and should stay. It unblocks all block-mining tests in CI.
#
#   ADDED — ceremony-smoke job:
#     Runs scripts/ceremony-smoke.sh (export-r1cs → snarkjs → import-zkey →
#     smoke-prove-verify). Isolated from other jobs. continue-on-error: true
#     until CircomReduction/verify is fixed so the rest of CI stays green.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── TypeScript workspace ────────────────────────────────────────────────────
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build lib declarations (tsc --build)
        run: pnpm run typecheck:libs

      - name: Typecheck all artifacts
        run: pnpm run typecheck

  # ── Rust core library (equilibrium) ─────────────────────────────────────────
  rust-check:
    name: Rust check & clippy (equilibrium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: equilibrium
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: equilibrium -> target

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  # ── Rust core library (variational-ai) ──────────────────────────────────────
  vai-check:
    name: Rust check & clippy (variational-ai)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variational-ai
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: variational-ai -> target

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  # ── TypeScript tests (Vitest) ───────────────────────────────────────────────
  ts-test:
    name: TypeScript tests (Vitest)
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: ""
          POSTGRES_DB: equilibrium
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned WASM contracts toolchain (1.97.0 + wasm32 target)
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target wasm32-unknown-unknown --no-self-update
      - name: Cache Rust build artifacts (variational-ai)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: variational-ai -> target

      - name: Build variational-ai CLI binaries
        working-directory: variational-ai
        run: cargo build --release --bin variational-ai-cli --bin variational-ai-arbitrage-cli

      - name: Copy CLI binaries to api-server directory
        run: |
          cp variational-ai/target/release/variational-ai-cli artifacts/api-server/
          cp variational-ai/target/release/variational-ai-arbitrage-cli artifacts/api-server/
      - name: Cache Rust build artifacts (equilibrium)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: equilibrium -> target

      - name: Build p2p-sidecar binary
        working-directory: equilibrium
        run: cargo build --release --bin p2p-sidecar

      - name: Build consensus-api binary
        working-directory: equilibrium
        run: cargo build --release --bin consensus-api

      - name: Add equilibrium release binaries to PATH
        run: echo "${{ github.workspace }}/equilibrium/target/release" >> $GITHUB_PATH

      - name: Cache Rust build artifacts (WASM contracts)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/arbitrage -> target
            contracts/model_registry -> target
            contracts/cross_chain_relay -> target
      - name: Rebuild WASM contracts from source
        run: |
          bash contracts/arbitrage/build.sh
          bash contracts/model_registry/build.sh
          bash contracts/cross_chain_relay/build.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build lib declarations
        run: pnpm run typecheck:libs

      - name: Push DB schema
        run: DATABASE_URL="postgresql://runner@localhost:5432/equilibrium" pnpm --filter @workspace/db run push --config ./drizzle.config.ts

      - name: Run all Vitest tests
        run: pnpm --filter @workspace/api-server run test
        env:
          DATABASE_URL: postgresql://runner@localhost:5432/equilibrium
          ALLOW_TS_TRAPDOOR_PROVER: "true"

  # ── Rust unit tests (equilibrium) ───────────────────────────────────────────
  rust-test:
    name: Rust unit tests (equilibrium)
    runs-on: ubuntu-latest
    needs: rust-check
    defaults:
      run:
        working-directory: equilibrium
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: equilibrium -> target
      - name: cargo test
        run: cargo test --all-targets

  # ── Rust unit tests (variational-ai) ────────────────────────────────────────
  vai-test:
    name: Rust unit tests (variational-ai)
    runs-on: ubuntu-latest
    needs: vai-check
    defaults:
      run:
        working-directory: variational-ai
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: variational-ai -> target
      - name: cargo test
        run: cargo test --lib

  # ── Ceremony smoke (snarkjs → ark import → prove/verify) ────────────────────
  # Isolated. continue-on-error: true until smoke exits 0.
  # Requires instrumented smoke-prove-verify (checks 1–4 + --vk-json-bin).
  ceremony-smoke:
    name: Ceremony smoke (snarkjs → ark)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build (mpc-ceremony + equilibrium)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mpc-ceremony -> target
            equilibrium -> target
          shared-key: ceremony-smoke

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install snarkjs
        run: npm install -g snarkjs

      - name: Show versions
        run: |
          rustc --version
          cargo --version
          command -v snarkjs
          echo "snarkjs: ok"
      # Always reach Diagnose — do not fail the step on smoke exit ≠ 0
      - name: Run ceremony smoke
        id: smoke
        run: |
          chmod +x scripts/ceremony-smoke.sh
          set +e
          ./scripts/ceremony-smoke.sh 2>&1 | tee ceremony-smoke.log
          echo "smoke_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Diagnose (checks 1–4 matrix)
        if: always()
        run: |
          set +e
          LOG=ceremony-smoke.log
          OUT=ceremony-smoke-out
          echo "════════════════════════════════════════════════════════"
          echo " CEREMONY SMOKE DIAGNOSTIC SUMMARY"
          echo "════════════════════════════════════════════════════════"
          echo "smoke_exit (from script): ${{ steps.smoke.outputs.smoke_exit }}"
          echo ""
          echo "── Raw check / smoke lines ──"
          grep -E '\[check |\[smoke\]|\[circom_reduction\]|\[proof:|failures=|CEREMONY SMOKE|Interpret:' "$LOG" | tail -60
          echo ""
          # --- Shell VK parity (backup if binary skipped check 2) ---
          echo "── Shell Check 2: VK binary parity ──"
          if [[ -f "$OUT/verification_key.bin" && -f "$OUT/verification_key_json.bin" ]]; then
            if cmp -s "$OUT/verification_key.bin" "$OUT/verification_key_json.bin"; then
              echo "[shell check 2] PASS — verification_key.bin == verification_key_json.bin"
            else
              echo "[shell check 2] FAIL — VK bins differ"
              ls -la "$OUT/verification_key.bin" "$OUT/verification_key_json.bin"
              echo "zkey VK sha256: $(sha256sum "$OUT/verification_key.bin")"
              echo "json VK sha256: $(sha256sum "$OUT/verification_key_json.bin")"
            fi
          else
            echo "[shell check 2] SKIP — VK bin(s) missing"
            ls -la "$OUT" 2>/dev/null || true
          fi
          echo ""
          # --- Parse instrumented binary results ---
          echo "── Classification from smoke binary ──"
          c1="UNKNOWN"; c2="UNKNOWN"; c3="UNKNOWN"; c4="UNKNOWN"
          if grep -q '\[check 1\] PASS' "$LOG"; then c1=PASS
          elif grep -q '\[check 1\] FAIL' "$LOG"; then c1=FAIL
          fi
          if grep -q '\[check 2\] PASS' "$LOG"; then c2=PASS
          elif grep -q '\[check 2\] FAIL' "$LOG"; then c2=FAIL
          elif grep -q '\[check 2\] SKIP' "$LOG"; then c2=SKIP
          fi
          if grep -q '\[check 3\] PASS' "$LOG"; then c3=PASS
          elif grep -q '\[check 3\] FAIL' "$LOG"; then c3=FAIL
          elif grep -q '\[check 3\] ERROR' "$LOG"; then c3=ERROR
          fi
          if grep -q '\[check 4\] PASS' "$LOG"; then c4=PASS
          elif grep -q '\[check 4\] FAIL' "$LOG"; then c4=FAIL
          elif grep -q '\[check 4\] ERROR' "$LOG"; then c4=ERROR
          fi
          echo "  check 1 (circuit / Libsnark self-test): $c1"
          echo "  check 2 (VK zkey vs JSON):              $c2"
          echo "  check 3 (Libsnark vs imported keys):    $c3"
          echo "  check 4 (CircomReduction vs imported):  $c4"
          echo ""
          if grep -q 'ark-circom-style' "$LOG"; then
            echo "[reduction] ark-circom-style CircomReduction WAS used"
          else
            echo "[reduction] ark-circom-style marker NOT found"
          fi
          echo ""
          echo "── Interpret ──"
          if [[ "$c1" == "FAIL" ]]; then
            echo "  → Fix StationarityCircuit / export_r1cs first."
          elif [[ "$c2" == "FAIL" ]]; then
            echo "  → Fix zkey_pk / JSON G2 parse (VK import bug)."
          elif [[ "$c3" == "FAIL" && "$c4" == "PASS" ]]; then
            echo "  → Expected for snarkjs keys. Ship CircomReduction; ignore Libsnark for ceremony path."
          elif [[ "$c3" == "PASS" && "$c4" == "FAIL" ]]; then
            echo "  → Circom H path wrong for this zkey. Fix CircomReduction (or use Libsnark if keys allow)."
          elif [[ "$c3" == "FAIL" && "$c4" == "FAIL" && "$c2" == "PASS" ]]; then
            echo "  → VK OK. Problem is prove path: H / A,B,L queries / wire assignment vs R1CS."
          elif [[ "$c1" == "PASS" && "$c2" == "PASS" && "$c3" == "PASS" && "$c4" == "PASS" ]]; then
            echo "  → All green. Set continue-on-error: false when ready."
          elif [[ "$c3" == "UNKNOWN" || "$c4" == "UNKNOWN" ]]; then
            echo "  → Instrumented checks not in log — smoke binary may be old or crashed early."
          else
            echo "  → See check matrix above + failures= line in log."
          fi
          echo "════════════════════════════════════════════════════════"
      - name: Upload smoke log + key artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ceremony-smoke-${{ github.sha }}
          path: |
            ceremony-smoke.log
            ceremony-smoke-out/stationarity.r1cs
            ceremony-smoke-out/verification_key.json
            ceremony-smoke-out/verification_key.bin
            ceremony-smoke-out/verification_key_json.bin
            ceremony-smoke-out/proving_key.bin
          if-no-files-found: warn
          retention-days: 14

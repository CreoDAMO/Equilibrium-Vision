# ─────────────────────────────────────────────────────────────────────────────
# ci-workflow-update.yml
#
# Copy the contents of this file over .github/workflows/ci.yml in your GitHub
# repo to apply the following changes:
#
# Changes vs. the currently-committed ci.yml:
#   1. ts-test comment updated: 10 test files, 257+ tests (was 8 / 245+).
#   2. ts-test Vitest run step name updated to list all 10 test files including
#      p2p-sync.integration and p2p-mesh.integration.
#   3. New step: build p2p-sidecar binary before Vitest so that
#      p2p-mesh.integration.test.ts runs its mesh tests instead of skipping.
#      The test file is skip-safe — if the binary is absent the 3 mesh tests
#      are skipped and CI still passes; the build step makes them run for real.
#   4. testTimeout bumped to 300 000 ms in the Vitest env so arbitrage.stress
#      tests (which mine ~103 blocks synchronously) don't timeout on CI runners.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── TypeScript workspace ────────────────────────────────────────────────────
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build lib declarations (tsc --build)
        run: pnpm run typecheck:libs

      - name: Typecheck all artifacts
        run: pnpm run typecheck

  # ── Rust core library (equilibrium) ─────────────────────────────────────────
  rust-check:
    name: Rust check & clippy (equilibrium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: equilibrium
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: equilibrium -> target

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  # ── Rust core library (variational-ai) ──────────────────────────────────────
  vai-check:
    name: Rust check & clippy (variational-ai)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: variational-ai
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: variational-ai -> target

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  # ── TypeScript tests (Vitest) — all 10 test files, 257+ tests ───────────────
  # Files: chain.unit, api.integration, contracts.integration,
  #        multisig.integration, models.integration, arbitrage.integration,
  #        crosschain.integration, arbitrage.stress,
  #        p2p-sync.integration, p2p-mesh.integration
  ts-test:
    name: TypeScript tests (Vitest)
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: ""
          POSTGRES_DB: equilibrium
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned WASM contracts toolchain (1.97.0 + wasm32 target)
        # The rust-toolchain.toml in each contracts/ subdirectory pins to 1.97.0
        # so that the checked-in .hex files are reproducible across runs.
        # WASM codegen is NOT byte-for-byte stable across rustc/LLVM versions;
        # a floating "stable" build produces different bytes even if source is
        # unchanged, which would fail the staleness check below.
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target wasm32-unknown-unknown --no-self-update

      - name: Cache Rust build artifacts (variational-ai)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: variational-ai -> target

      - name: Build variational-ai CLI binaries
        working-directory: variational-ai
        run: cargo build --release --bin variational-ai-cli --bin variational-ai-arbitrage-cli

      - name: Copy CLI binaries to api-server directory
        run: |
          cp variational-ai/target/release/variational-ai-cli artifacts/api-server/
          cp variational-ai/target/release/variational-ai-arbitrage-cli artifacts/api-server/

      - name: Cache Rust build artifacts (WASM contracts)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/arbitrage -> target
            contracts/model_registry -> target
            contracts/cross_chain_relay -> target

      - name: Rebuild WASM contracts from source
        # Always rebuilds all three contracts from source so the Vitest suite
        # runs against freshly-compiled bytecode, not the committed .hex.
        # WASM codegen is not byte-for-byte reproducible across environments
        # (different sysroots / cargo caches produce different output even with
        # the same rustc version), so a byte-level git-diff staleness check
        # produces false failures. Correctness is verified by the test suite.
        run: |
          bash contracts/arbitrage/build.sh
          bash contracts/model_registry/build.sh
          bash contracts/cross_chain_relay/build.sh

      # ── NEW: build p2p-sidecar so p2p-mesh.integration tests run for real ──
      # p2p-mesh.integration.test.ts uses describe.skipIf(!binPresent) — if
      # the binary is absent the 3 mesh tests are skipped and CI passes; this
      # step makes them actually execute. Cache key covers the equilibrium
      # source tree so rebuilds are only triggered when relevant Rust changes.
      - name: Cache Rust build artifacts (p2p-sidecar)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: equilibrium -> target
          key: p2p-sidecar

      - name: Build p2p-sidecar binary
        working-directory: equilibrium
        run: cargo build --release --bin p2p-sidecar

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build lib declarations
        run: pnpm run typecheck:libs

      - name: Push DB schema
        run: DATABASE_URL="postgresql://runner@localhost:5432/equilibrium" pnpm --filter @workspace/db run push --config ./drizzle.config.ts

      - name: Run all Vitest tests (10 files)
        # chain.unit, api.integration, contracts.integration,
        # multisig.integration, models.integration, arbitrage.integration,
        # crosschain.integration, arbitrage.stress,
        # p2p-sync.integration, p2p-mesh.integration
        run: pnpm --filter @workspace/api-server run test
        env:
          DATABASE_URL: postgresql://runner@localhost:5432/equilibrium
          # arbitrage.stress mines ~103 blocks per test — 300 s keeps them from
          # timing out on slower CI runners (default was 120 s).
          VITEST_TIMEOUT: "300000"

  # ── Rust unit tests (equilibrium) ───────────────────────────────────────────
  rust-test:
    name: Rust unit tests (equilibrium)
    runs-on: ubuntu-latest
    needs: rust-check
    defaults:
      run:
        working-directory: equilibrium
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: equilibrium -> target

      - name: cargo test
        run: cargo test --all-targets

  # ── Rust unit tests (variational-ai) ────────────────────────────────────────
  vai-test:
    name: Rust unit tests (variational-ai)
    runs-on: ubuntu-latest
    needs: vai-check
    defaults:
      run:
        working-directory: variational-ai
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: variational-ai -> target

      - name: cargo test
        run: cargo test --lib

# Render blueprint for the public organism.
# Rust libp2p and the Android APK are not this service.
# Attach Postgres so the chain survives a restart (DATABASE_URL).
services:
  - type: web
    name: equilibrium
    runtime: node
    rootDir: site
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /api/light
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: equilibrium-db
          property: connectionString
databases:
  - name: equilibrium-db
    plan: basic-256mb
    postgresMajorVersion: "16"

[package]
name = "stationarity-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
risc0-zkvm = { version = "3.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
# sha2 with no_std support — required by the residual_at_nonce recompute
sha2 = { version = "0.10", default-features = false }

# Render blueprint for the public organism.
# Rust libp2p and the Android APK are not this service.
# Attach Postgres so the chain survives a restart (DATABASE_URL).
# vite is a devDependency. NODE_ENV=production would omit it, and the start
# command invokes node_modules/vite/bin/vite.js directly (not PATH).
services:
  - type: web
    name: equilibrium
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /api/light
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: equilibrium-db
          property: connectionString
databases:
  - name: equilibrium-db
    plan: basic-256mb
    postgresMajorVersion: "16"
